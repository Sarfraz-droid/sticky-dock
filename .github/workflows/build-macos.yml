name: Build macOS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-14 # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Universal binary = runs natively on Apple Silicon AND Intel (no Rosetta prompt).
      - run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned build
      - name: Verify the app is a universal (arm64 + x86_64) binary
        run: |
          APP="dist/mac-universal/Sticky Dock.app"
          lipo -archs "$APP/Contents/MacOS/Sticky Dock"
          lipo -archs "$APP/Contents/MacOS/Sticky Dock" | grep -q arm64
      - uses: actions/upload-artifact@v4
        with:
          name: sticky-dock-macos
          # zip only: the dmg is a duplicate of the same app, doubling the upload.
          path: dist/*.zip
          # zip is already compressed; re-deflating wastes CPU and time.
          compression-level: 0
          retention-days: 7
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
